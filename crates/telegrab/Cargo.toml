[package]
name = "telegrab"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
description = """
fetch all pics in a telegra.ph/teletype.in page,
and archive it into a comic pack.
"""

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "telegrab"

[dependencies]
telegrab-model = { path = "../telegrab-model" }
telegrab-db = { path = "../telegrab-db" }
telegrab-core = { path = "../telegrab-core" }
anyhow = { workspace = true }
mimalloc = { workspace = true, features = ["secure"] }
async-graphql = { workspace = true, features = ["time", "dataloader", "apollo_persisted_queries"] }
async-graphql-axum = { workspace = true }
axum = { version = "0.8.9", features = ["macros", "tracing"] }
backtrace_printer = "1.3.0"
base64 = "0.22.1"
colored = "3.1.1"
config = { version = "0.15.23", default-features = false, features = ["yaml"] }
convert_case = { workspace = true }
dashmap = "6"
futures-util = { version = "0.3", features = ["sink", "std"] }
hyper = "1.9.0"
notify = "8.2.0"
quick-xml = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
scraper = { workspace = true }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { workspace = true }
serde-aux = "4.7.0"
serde_json = { workspace = true }
serde_variant = "0.1.3"
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "macros", "migrate"] }
sqlx-postgres = { workspace = true, features = ["uuid", "time"] }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["trace", "fs"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
url = { workspace = true }
uuid = { workspace = true, features = ["serde"] }
validator = "0.20.0"
zip = { workspace = true }

# unix specific deps
[target."cfg(unix)".dependencies]
listenfd = "1.0.2"
