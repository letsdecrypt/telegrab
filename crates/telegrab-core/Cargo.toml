[package]
name = "telegrab-core"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
description = "Core business logic for telegrab"

[lib]
path = "src/lib.rs"

[dependencies]
telegrab-model = { path = "../telegrab-model" }
telegrab-db = { path = "../telegrab-db" }
serde = { workspace = true }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio"] }
sqlx-postgres = { workspace = true, features = ["uuid", "time"] }
tokio = { workspace = true, features = ["sync", "rt"] }
time = { workspace = true }
convert_case = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
scraper = { workspace = true }
thiserror = { workspace = true }
quick-xml = { workspace = true }
zip = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
