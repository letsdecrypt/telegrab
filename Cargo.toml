[workspace]
members = [ "crates/telegrab-model", "crates/telegrab-db", "crates/telegrab-core", "crates/telegrab", "crates/telegrabber" ]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["Jonir Rings <i@jonirrings.com>"]

[profile.release]
lto = "thin"
opt-level = "z"
strip = true
panic = "abort"

[workspace.dependencies]
anyhow = "1"
mimalloc = "0.1"
async-graphql = "8.0.0-rc.5"
async-graphql-axum = "8.0.0-rc.5"
convert_case = "0.11"
quick-xml = { version = "0", features = ["serialize"] }
regex = "1"
reqwest = "0.13"
scraper = "0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false }
sqlx-postgres = "0.9"
thiserror = "2"
time = { version = "0.3", features = ["serde-human-readable"] }
tokio = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "8", default-features = false, features = ["time"] }

[profile.dev]
opt-level = 0
debug = 2
incremental = true
